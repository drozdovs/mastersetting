# MasterSetting — продакшн-развёртывание (изолированно в /root/mastersettings_app)
# Наружу через Caddy (mastersettings.app.dsdp.ru -> 127.0.0.1:8010).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mastersetting}
      POSTGRES_USER: ${POSTGRES_USER:-mastersetting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - ms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mastersetting}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ms_net]

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    environment:
      MS_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-mastersetting}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mastersetting}
      MS_JWT_SECRET: ${MS_JWT_SECRET:?required}
      MS_ADMIN_LOGIN: ${MS_ADMIN_LOGIN:-admin}
      MS_ADMIN_PASSWORD: ${MS_ADMIN_PASSWORD:?required}
      MS_CORS_ORIGINS: https://mastersettings.app.dsdp.ru
      MS_RELEASES_DIR: /data/releases
    volumes:
      - ms_releases:/data/releases
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [ms_net]

volumes:
  ms_pgdata:
  ms_releases:

networks:
  ms_net:
    driver: bridge
